# Home Assistant app manifest for Leaflog.
# Keys follow the current (2026-11) app/add-on config reference; naming
# is in flux upstream ("add-ons" → "apps"), re-checked each milestone.
name: Leaflog
version: "0.5.0"
slug: leaflog
description: Cannabis grow diary that lives inside Home Assistant
url: https://github.com/PurpleBooth/leaflog
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8099
panel_icon: mdi:cannabis
panel_title: Leaflog
panel_admin: true
homeassistant_api: true
init: false
map:
  - data:rw
backup: hot
backup_exclude:
  - photos/thumbnails
image: ghcr.io/purplebooth/leaflog-{arch}
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
