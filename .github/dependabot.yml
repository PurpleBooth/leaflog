# Keeps the pinned workflow actions and the committed lockfiles
# current (R4 and R10 in docs/THREAT-MODEL.md): each bump is a
# reviewable PR. The Rust tree has one Cargo.lock at the root; the two
# npm trees are the ECharts bundle and the Playwright suite.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: e2e
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: crates/leaflog-frontend/charts
    schedule:
      interval: weekly
