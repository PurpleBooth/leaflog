# PR validation: conventional-commit format check via cocogitto.
# Runs on every pull request; blocks merge on non-conventional commits.

name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  conventional-commits:
    name: Conventional commit format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install cocogitto
        env:
          COG_VERSION: "6.2.0"
        run: |
          curl -sSL "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin
          cog --version

      - name: Check conventional commits
        run: cog check --from-branch-format "origin/{branch}"

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `⚠️ **Conventional commit check failed**

            Commits in this PR must follow the [Conventional Commits](https://www.conventionalcommits.org/) format:
            \`\`\`
            <type>(<scope>): <description>

            [optional body]

            [optional footer]
            \`\`\`

            Types: \`feat\`, \`fix\`, \`perf\`, \`refactor\`, \`docs\`, \`test\`, \`build\`, \`ci\`, \`chore\`, \`style\`, \`revert\`

            Run \`cog check\` locally to verify.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
