# Release pipeline: on a v* tag, run the full CI gate, generate a
# changelog with cocogitto, create a GitHub Release, and publish the
# multi-arch image. Releases are cut by pushing a v* tag: create it
# locally with the version commit (`cog bump --auto`; when cocogitto's
# own signing fails, finish its commit + tag with git) and sync the
# version files first (leaflog/config.yaml, workspace Cargo.toml,
# Cargo.lock, custom_components/leaflog/manifest.json). The pipeline
# then rewrites CHANGELOG.md wholesale from `cog changelog` (D042) and
# commits it with the version sync, so the file is always cocogitto
# output regardless of local tooling. A dispatch re-runs the release
# for whatever version leaflog/config.yaml declares — a recovery hatch
# for a broken release, not a bumper; the former `bump` input was
# never honoured (D039).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # --- Full CI gate before any release artifact ---
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # --- Cocogitto: changelog + version bump + tag ---
  release:
    needs: ci
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cocogitto and just
        env:
          COG_VERSION: "6.2.0"
          JUST_VERSION: "1.59.0"
        run: |
          curl -sSL "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/cog.tar.gz
          tar -xzf /tmp/cog.tar.gz -C /tmp
          cp /tmp/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
          chmod +x /usr/local/bin/cog
          cog --version
          curl -sSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /usr/local/bin just
          just --version

      - name: Verify conventional commits
        run: cog check

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep '^version' leaflog/config.yaml | sed 's/version: "\(.*\)"/\1/')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ROOT="$(git rev-list --max-parents=0 HEAD | tail -1)"
          # Released history up to this tag only: no Unreleased section,
          # even on a dispatch re-run where main has moved past the tag.
          cog changelog --template default "${ROOT}..v${VERSION}" > /tmp/changelog.md
          # Rewrite CHANGELOG.md wholesale from cocogitto via the same
          # recipe used locally (D042), so bump-time drift never survives
          # a release. Committed by the version-sync step below.
          just changelog
          # Write the release body to a multiline output
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<$EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/changelog.md >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Sync version files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Update config.yaml version
          sed -i "s/^version: .*/version: \"$VERSION\"/" leaflog/config.yaml
          # Update Cargo.toml workspace version. Only [workspace.package]
          # `version` sits at a line start; internal deps are path-only
          # so no version pin can go stale here (D039).
          sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
          # Update manifest.json
          python3 -c "
          import json
          with open('custom_components/leaflog/manifest.json') as f:
              m = json.load(f)
          m['version'] = '$VERSION'
          with open('custom_components/leaflog/manifest.json', 'w') as f:
              json.dump(m, f, indent=2)
              f.write('\n')
          "
          # Cargo.lock records each member's version; keep it in step
          # so the commit builds cleanly even under --locked. -w limits
          # the update to workspace members, never registry deps.
          cargo update --workspace
          # Commit if changed
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add leaflog/config.yaml Cargo.toml Cargo.lock custom_components/ CHANGELOG.md
            git commit -m "chore(release): bump version to $VERSION"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Leaflog ${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

  # --- Multi-arch image (reuses the image workflow's build) ---
  image:
    needs: release
    uses: ./.github/workflows/image.yml
    secrets: inherit
