name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  # Weekly gate on the floating `stable` toolchain (rust-toolchain.toml
  # pins the channel, not a version — D071 keeps that policy): catches
  # lint and toolchain drift within days instead of mid-release.
  schedule:
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt, clippy (native + wasm), tests, WASM build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 # Reads rust-toolchain.toml (stable + clippy, rustfmt, wasm32).
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # The frontend build runs the ECharts bundle step (D088): npm ci
      # + esbuild. Pinned like the e2e job's node; the release image
      # never sees it (the Dockerfile build stage installs its own).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install just, trunk and cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just@1.59.0,trunk@0.21.14,cargo-deny@0.20.2

      - name: Run the CI gate
        run: just ci

  # Frontend E2E (D069): Playwright against the built dist/, the real
  # backend and the mock Supervisor under a simulated ingress prefix.
  # `just e2e` skips when node is absent — this job installs node and
  # chromium so the gate is actually enforced (the prose-job pattern).
  e2e:
    name: playwright e2e + wasm component tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 # Reads rust-toolchain.toml (stable + clippy, rustfmt, wasm32):
      # the e2e recipe builds the frontend and both Rust binaries.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install just and trunk
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just@1.59.0,trunk@0.21.14

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install e2e deps and chromium
        run: |
          cd e2e && npm ci
          npx playwright install --with-deps chromium

      - name: Run the e2e suite
        run: just e2e

      # Browser-run component tests (D139): `just test-wasm` downloads
      # the pinned wasm-bindgen CLI and Chrome for Testing itself; the
      # job only supplies unzip and the shared-library deps Chrome
      # needs headless (playwright's dep installer owns that list).
      - name: Run the wasm component tests
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          sudo npx playwright install-deps chromium
          just test-wasm

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # Prose gate (D065): markdown, Rust comments and UI strings must not
  # contain LLM-sounding vocabulary or wall-of-text sentences. `just
  # ci` runs the recipe too, but skips it when vale is absent — this
  # job installs vale so the gate is actually enforced.
  prose:
    name: vale (prose lint)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install just
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just@1.59.0

      - name: Install vale
        env:
          # Keep in sync with devbox.json's vale@3 (devbox.lock pins
          # the exact version).
          VALE_VERSION: "3.26.0"
        run: |
          curl -sSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o /tmp/vale.tar.gz
          tar -xzf /tmp/vale.tar.gz -C /tmp
          cp /tmp/vale /usr/local/bin/vale
          chmod +x /usr/local/bin/vale
          vale --version

      - name: Lint prose
        run: just lint-prose

  # Full-history secret scan. The repository is public; nothing secret
  # may ever land in any commit (see docs/THREAT-MODEL.md, supply chain).
  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # gitleaks scans the whole history, not just HEAD.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          cp /tmp/gitleaks /usr/local/bin/gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      # --redact so a real finding never echoes the secret into public logs.
      - name: Scan git history for secrets
        run: gitleaks git --verbose --redact .
