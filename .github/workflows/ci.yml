name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt, clippy (native + wasm), tests, WASM build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Reads rust-toolchain.toml (stable + clippy, rustfmt, wasm32).
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install just, trunk and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,trunk@0.21.14,cargo-deny@0.20.2

      - name: Run the CI gate
        run: just ci

  # Prose gate (D065): markdown, Rust comments and UI strings must not
  # contain LLM-sounding vocabulary or wall-of-text sentences. `just
  # ci` runs the recipe too, but skips it when vale is absent — this
  # job installs vale so the gate is actually enforced.
  prose:
    name: vale (prose lint)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0

      - name: Install vale
        env:
          # Keep in sync with devbox.json's vale@3 (devbox.lock pins
          # the exact version).
          VALE_VERSION: "3.26.0"
        run: |
          curl -sSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o /tmp/vale.tar.gz
          tar -xzf /tmp/vale.tar.gz -C /tmp
          cp /tmp/vale /usr/local/bin/vale
          chmod +x /usr/local/bin/vale
          vale --version

      - name: Lint prose
        run: just lint-prose

  # Full-history secret scan. The repository is public; nothing secret
  # may ever land in any commit (see docs/THREAT-MODEL.md, supply chain).
  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # gitleaks scans the whole history, not just HEAD.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          cp /tmp/gitleaks /usr/local/bin/gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      # --redact so a real finding never echoes the secret into public logs.
      - name: Scan git history for secrets
        run: gitleaks git --verbose --redact .
