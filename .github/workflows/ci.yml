name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt, clippy (native + wasm), tests, WASM build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Reads rust-toolchain.toml (stable + clippy, rustfmt, wasm32).
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install just and trunk
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,trunk@0.21.14

      - name: Run the CI gate
        run: just ci

  # Full-history secret scan. The repository is public; nothing secret
  # may ever land in any commit (see docs/THREAT-MODEL.md, supply chain).
  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # gitleaks scans the whole history, not just HEAD.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          cp /tmp/gitleaks /usr/local/bin/gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      # --redact so a real finding never echoes the secret into public logs.
      - name: Scan git history for secrets
        run: gitleaks git --verbose --redact .
