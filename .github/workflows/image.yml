# Builds, scans, signs and publishes the multi-arch Leaflog app image.
#
# Per-arch native runners build each architecture (no cross/emulation),
# pushing ghcr.io/purplebooth/leaflog-<arch>:<tag>; a merge job then
# creates the multi-arch manifest ghcr.io/purplebooth/leaflog:<tag>.
# Each pushed digest is scanned with Trivy and signed with cosign
# (keyless, Sigstore) before the merge; the merge job signs the final
# index too. Verification is pinned to this workflow's identity, so a
# verifier only needs the repository and the issuer
# (docs/DECISIONS.md D162). Authentication uses only the built-in
# GITHUB_TOKEN — no custom secrets (the repository is public; nothing
# secret may appear here).

name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/purplebooth/leaflog
  # The identity cosign signs as and verifies against: the GitHub OIDC
  # issuer, and this workflow file at the ref it ran from. The merge
  # job runs in this same file whether it was pushed directly or
  # called from release.yml, so one value covers both.
  COSIGN_IDENTITY: https://github.com/PurpleBooth/leaflog/.github/workflows/image.yml
  COSIGN_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      # Keyless cosign: the OIDC token becomes the signing certificate.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          # `arch` is Docker's TARGETARCH and the image-tag suffix; the
          # index records the OCI name, where aarch64 is arm64.
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arch image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: leaflog/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            TARGETARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.tag.outputs.tag }}
          push: true
          tags: ${{ env.IMAGE }}-${{ matrix.arch }}:${{ steps.tag.outputs.tag }}
          # Provenance is attached by default; the SBOM is attached the
          # same way (an attestation manifest beside the image), so
          # `cosign download attestation` and Trivy can read it.
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # Scan the pushed digest, not the tag: that is what gets signed
      # and merged. HIGH/CRITICAL only, fixed-only, so the gate stays
      # at zero noise; `.trivyignore` lists the deliberate exceptions
      # with their reasons. The platform is set explicitly with the
      # OCI name: trivy-action has no platform input, only the TRIVY_*
      # env passthrough, and trivy matches the platform against the
      # index strictly ("no child with platform linux/aarch64" —
      # Docker's aarch64 is arm64 there).
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}-${{ matrix.arch }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.6

      - name: Sign the arch image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}-${{ matrix.arch }}@${DIGEST}"

      # Same pinned identity as the merge job's verify step: the
      # signature must come from this workflow at this ref.
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity="${COSIGN_IDENTITY}@${GITHUB_REF}" \
            --certificate-oidc-issuer="${COSIGN_ISSUER}" \
            "${IMAGE}-${{ matrix.arch }}@${DIGEST}"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge, sign and verify
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Determine image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each build job pushes ghcr.io/purplebooth/leaflog-<arch>:<tag>
      # and exports its digest; reference those arch images here.
      - name: Create manifest
        id: manifest
        run: |
          sources=""
          for dir in /tmp/digests/digests-*; do
            arch="${dir##*/digests-}"
            for digest in "$dir"/*; do
              sources="$sources ${IMAGE}-${arch}@sha256:$(basename "$digest")"
            done
          done
          echo "merging:$sources"
          docker buildx imagetools create \
            -t "${IMAGE}:${{ steps.tag.outputs.tag }}" \
            $sources
          # The index digest of what we just pushed, for signing.
          digest="$(docker buildx imagetools inspect "${IMAGE}:${{ steps.tag.outputs.tag }}" \
            --format '{{ json .Manifest }}' | jq -r '.digest')"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.6

      # --recursive also signs the per-arch manifests inside the index.
      - name: Sign the multi-arch index
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign sign --yes --recursive \
            "${IMAGE}@${DIGEST}"

      # Prove the signature verifies against the pinned identity, so a
      # broken signing setup fails here instead of at the user's end.
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity="${COSIGN_IDENTITY}@${GITHUB_REF}" \
            --certificate-oidc-issuer="${COSIGN_ISSUER}" \
            "${IMAGE}@${DIGEST}"

      - name: Show how to verify
        run: |
          echo "Signed ${IMAGE}:${{ steps.tag.outputs.tag }} (${GITHUB_REF})."
          echo "Verify with:"
          echo "  cosign verify \\"
          echo "    --certificate-identity '${COSIGN_IDENTITY}@${GITHUB_REF}' \\"
          echo "    --certificate-oidc-issuer '${COSIGN_ISSUER}' \\"
          echo "    '${IMAGE}@${{ steps.manifest.outputs.digest }}'"
