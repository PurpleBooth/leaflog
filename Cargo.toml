[workspace]
resolver = "2"
members = [
    "crates/leaflog-backend",
    "crates/leaflog-core",
    "crates/leaflog-frontend",
    "crates/mock-ha",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Unlicense"
repository = "https://github.com/PurpleBooth/leaflog"
readme = "README.md"
keywords = ["home-assistant", "grow", "diary", "rust"]
categories = ["web-programming", "science"]

[workspace.dependencies]
leaflog-core = { path = "crates/leaflog-core", version = "0.2.0" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lean release artifacts for the HA image. Note: no `strip` here —
# stripping removes the wasm `target_features` section, which makes
# wasm-bindgen unable to detect enabled features (it then runs its own
# wasm-opt, which chokes on bulk-memory ops). The backend binary is
# stripped in the Dockerfile instead (docs/DECISIONS.md D009).
[profile.release]
lto = true
codegen-units = 1
