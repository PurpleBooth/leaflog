# Prose gate (D065). Two style packages, curated:
#
# - Prose        — repo-owned rules: LLM-tell vocabulary and a
#                  30-word sentence cap (the language-complexity
#                  gate). Surgical word list; see llm-speak.yml for
#                  the domain words deliberately not flagged.
# - write-good   — the standard grammar lints (passive voice, wordy
#                  phrases, weasel words, "there is" openings),
#                  vendored verbatim from errata-ai/write-good (MIT).
#
# Scope: markdown (not the changelogs or licence), Rust comments and
# frontend UI strings, extracted by `just lint-prose`.
StylesPath = .vale/styles
MinAlertLevel = warning

[*.{md,txt}]
BasedOnStyles = Prose, write-good
# Be-verb avoidance is unusable in technical prose ("is stored" is
# the right voice for describing state).
write-good.E-Prime = NO
# Passive voice is correct style for describing state and process;
# the rule flags 380+ legitimate hits, so it advises instead of
# gating. Visible with `vale --minAlertLevel=suggestion`.
write-good.Passive = suggestion
# The wordy-phrase list targets business prose and collides with the
# domain: "minimum"/"maximum" (preset ranges), "purchase" (equipment
# log), "equivalent" (EC↔TDS). Advise only.
write-good.TooWordy = suggestion
