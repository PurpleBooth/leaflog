[package]
name = "leaflog-backend"
description = "Leaflog backend: Axum server hosting the ingress-correct SPA, the JSON API, and the Home Assistant Supervisor link."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[features]
default = ["embed-assets"]
# Embed the compiled frontend (`trunk build` output) into the binary.
# Disable for development, where assets are served from disk instead so
# `trunk watch` rebuilds are picked up without recompiling the backend.
embed-assets = ["dep:include_dir"]

[dependencies]
leaflog-core.workspace = true
axum = { workspace = true, features = ["multipart"] }
# Request tracing (D158): TraceLayer wraps every request — method,
# path, status, latency. Headers stay out (the ingress token rides
# the Authorization header).
# Brotli and gzip responses (the wasm bundle shrinks by two thirds on
# the wire) and the router-wide cache policy.
tower-http = { version = "0.6", features = ["trace", "compression-br", "compression-gzip", "set-header"] }
tokio = { workspace = true, features = ["net", "signal", "fs"] }
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
include_dir = { version = "0.7", optional = true }
tower = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
# Maintained migration runner (spec §3, D048): auto-discovered SQL
# files, checksum-verified history, divergent/out-of-order refusal.
refinery = { version = "0.10", features = ["rusqlite"], default-features = false }
ulid = "3"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
thiserror = "2"
sha2.workspace = true
base64.workspace = true
tracing.workspace = true
# Stdout fmt subscriber (D158); `env-filter` enables the RUST_LOG
# override of the info default.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
mock-ha = { path = "../mock-ha" }
# `ws`: tests script a stand-in Supervisor WebSocket (tests/ha.rs).
axum = { workspace = true, features = ["multipart", "ws"] }
tokio.workspace = true
serde_json.workspace = true
# `http2` lets tests speak HTTP/2 prior knowledge to the listener.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "http2"] }
# tests/migrations.rs drives the migration runner directly.
rusqlite = { version = "0.41", features = ["bundled"] }
refinery = { version = "0.10", features = ["rusqlite"], default-features = false }
