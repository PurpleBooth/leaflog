[package]
name = "leaflog-backend"
description = "Leaflog backend: Axum server hosting the ingress-correct SPA, the JSON API, and the Home Assistant Supervisor link."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[features]
default = ["embed-assets"]
# Embed the compiled frontend (`trunk build` output) into the binary.
# Disable for development, where assets are served from disk instead so
# `trunk watch` rebuilds are picked up without recompiling the backend.
embed-assets = ["dep:include_dir"]

[dependencies]
leaflog-core.workspace = true
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true, features = ["net", "signal", "fs"] }
serde.workspace = true
serde_json.workspace = true
include_dir = { version = "0.7", optional = true }
tower = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
ulid = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
thiserror = "2"

[dev-dependencies]
axum = { workspace = true, features = ["multipart"] }
tokio.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
