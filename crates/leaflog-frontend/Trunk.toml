[build]
target = "index.html"
dist = "dist"
# Relative public URL: no base path is ever baked into the build; the
# backend injects <base href> at serve time from X-Ingress-Path.
public_url = "./"

# Tailwind v4 standalone CLI, managed by Trunk (a Node-free binary;
# the charts bundle beside it uses npm + esbuild at build time, D088).
# Both are build-time only — they never reach the image. CSS entry is
# `tailwind.css`, wired via <link data-trunk rel="tailwind-css"> in
# index.html.
[tools]
tailwindcss = "4.3.5"

# Class tokens live in the Rust sources; editing them must recompile
# the stylesheet too.
[watch]
watch = ["src"]
