[package]
name = "leaflog-frontend"
description = "Leaflog frontend: Leptos CSR single-page app served by the backend under a runtime-injected ingress base."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
leaflog-core.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlInputElement", "FormData", "File", "FileList"] }
gloo-net = { version = "0.6", features = ["json"] }
serde.workspace = true
serde_json.workspace = true

[package.metadata.leptos]
# CSR only; kept for tooling that reads Leptos metadata.
output-name = "leaflog-frontend"
