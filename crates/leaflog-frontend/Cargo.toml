[package]
name = "leaflog-frontend"
description = "Leaflog frontend: Leptos CSR single-page app served by the backend under a runtime-injected ingress base."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
leaflog-core.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlElement", "FormData", "File", "FileList", "Element", "Node", "NodeList", "Window", "Document", "CssStyleDeclaration", "Event", "MouseEvent", "KeyboardEvent", "FocusEvent", "HtmlHtmlElement", "MutationObserver", "MutationObserverInit", "EventSource", "MessageEvent"] }
gloo-net = { version = "0.6", features = ["json"] }
# Request timeout for the grows page list fetches (ticket 02):
# gloo-timers pairs a timer future with the request via futures select.
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
# The ECharts option payload crosses the wasm boundary as a JsValue
# (ticket 02, temperature chart).
serde-wasm-bindgen = "0.6"
# Quick-add menu icons (ticket 06): leptos_icons renders Lucide SVGs
# (icondata_lu) — one icon family, no emoji, no vendored art.
leptos_icons = "0.7"
icondata_lu = "0.1"
icondata_core = "0.1"

[package.metadata.leptos]
# CSR only; kept for tooling that reads Leptos metadata.
output-name = "leaflog-frontend"
