[package]
name = "leaflog-frontend"
description = "Leaflog frontend: Leptos CSR single-page app served by the backend under a runtime-injected ingress base."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
leaflog-core.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
# Compile-time i18n (D112, ADR 0003): JSON catalogs under locales/, en is
# the default locale and the key source of truth. CSR, no cookie; the
# HA-language step of the chain (HA → browser → en) is applied explicitly
# by LocaleChain, the browser step is leptos_i18n's implicit
# navigator.languages matching at first paint (docs/ARCHITECTURE.md).
leptos_i18n = { workspace = true, default-features = false, features = [
    "csr",
    "plurals",
    "icu_compiled_data",
] }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# The last seven features (EventInit … HtmlFieldSetElement) are for
# the component-test support module (D139).
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlElement", "HtmlDialogElement", "FormData", "File", "FileList", "Element", "Node", "NodeList", "Window", "Document", "CssStyleDeclaration", "Event", "MouseEvent", "KeyboardEvent", "FocusEvent", "BeforeUnloadEvent", "HtmlHtmlElement", "MutationObserver", "MutationObserverInit", "EventSource", "MessageEvent", "Storage", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "console", "Location", "EventInit", "MouseEventInit", "HtmlSelectElement", "HtmlOptionsCollection", "HtmlTextAreaElement", "HtmlButtonElement", "HtmlLabelElement", "HtmlFieldSetElement"] }
gloo-net = { version = "0.8", features = ["json"] }
# Request timeout for the grows page list fetches (ticket 02):
# gloo-timers pairs a timer future with the request via futures select.
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
# Structured logging (D158): same tracing macros as the backend; this
# layer mirrors events into the browser devtools console (INFO+).
tracing.workspace = true
wasm-tracing = "2.1"
# The ECharts option payload crosses the wasm boundary as a JsValue
# (ticket 02, temperature chart).
serde-wasm-bindgen = "0.6"
# Quick-add menu icons (ticket 06): leptos_icons renders Lucide SVGs
# (icondata_lu) — one icon family, no emoji, no vendored art.
leptos_icons = "0.7"
icondata_lu = "0.1"
icondata_core = "0.1"

# Component tests run in a real browser via wasm-bindgen-test
# (docs/DECISIONS.md, D139): target-gated so native `cargo test` never
# pulls or compiles them.
[target.wasm32-unknown-unknown.dev-dependencies]
wasm-bindgen-test = "=0.3.80"
# Leptos mounts need the global any_spawner executor initialized
# (`start_app` does it for the app; tests must do it themselves).
# Pin the same version leptos resolves to in the lockfile.
any_spawner = { version = "0.3.0", features = ["wasm-bindgen"] }

[build-dependencies]
# Catalog codegen for leptos_i18n (D112): parses locales/ at build time
# and enforces EN↔DE key parity via the generated keys struct.
leptos_i18n_build = { version = "0.6", default-features = false, features = [
    "csr",
] }
# Key-parity check in build.rs (D112): compares the flattened key sets
# of locales/en.json and locales/de.json.
serde_json.workspace = true

[package.metadata.leptos]
# CSR only; kept for tooling that reads Leptos metadata.
output-name = "leaflog-frontend"
